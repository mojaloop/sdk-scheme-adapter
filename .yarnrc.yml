approvedGitRepositories:
  - "**"

compressionLevel: mixed

enableGlobalCache: false

enableScripts: true

nodeLinker: node-modules

npmAuditIgnoreAdvisories:
  - 1124334
  # glob GHSA-3g3m-2fjr-6pw4 (glob 10.x/13.x): fixed only in 14.0.2; the tool cannot override across majors (2026-11-20)
  - 1244013
  # minimatch GHSA-g3hv-75wg-m249 (minimatch 9.x/10.x): fixed only in 11.0.1; same major-bump limit (2026-11-20)
  - 1244623

npmMinimalAgeGate: 0

packageExtensions:
  "@mojaloop/central-services-shared@*":
    peerDependenciesMeta:
      "@mojaloop/central-services-error-handling":
        optional: true
      "@mojaloop/central-services-logger":
        optional: true
      "@mojaloop/central-services-metrics":
        optional: true
      "@mojaloop/event-sdk":
        optional: true
      ajv:
        optional: true
      ajv-formats:
        optional: true
      ajv-keyboards:
        optional: true
      ajv-keywords:
        optional: true
      knex:
        optional: true
      mysql2:
        optional: true
  eslint-plugin-jest@*:
    peerDependenciesMeta:
      typescript:
        optional: true

yarnPath: .yarn/releases/yarn-4.18.0.cjs
