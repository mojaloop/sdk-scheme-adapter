compressionLevel: mixed

enableGlobalCache: false

nodeLinker: node-modules

# brace-expansion GHSA-mh99-v99m-4gvg (CVE-2026-14257, memory-exhaustion DoS) affects <=5.0.7; the
# only fix is 5.0.8, a breaking ESM/named-export major incompatible with the CJS minimatch 3.x-9.x
# that pull the residual brace-expansion 1.1.16/2.1.2 (transitive dev/build tooling). No 1.x or 2.x
# fix exists; app-level 5.x is already pinned to the fixed 5.0.8 via resolutions. Ignore for
# `yarn npm audit` (scripts/audit-check.js); grype ignores the same in .grype.yaml.
npmAuditIgnoreAdvisories:
  - "1124334" # GHSA-mh99-v99m-4gvg (yarn npm audit keys by npm's numeric advisory id)

yarnPath: .yarn/releases/yarn-4.12.0.cjs

packageExtensions:
  "@mojaloop/central-services-shared@*":
    peerDependenciesMeta:
      "@mojaloop/central-services-error-handling":
        optional: true
      "@mojaloop/central-services-logger":
        optional: true
      "@mojaloop/central-services-metrics":
        optional: true
      "@mojaloop/event-sdk":
        optional: true
      ajv:
        optional: true
      ajv-formats:
        optional: true
      ajv-keywords:
        optional: true
      ajv-keyboards:
        optional: true
      knex:
        optional: true
      mysql2:
        optional: true
  "eslint-plugin-jest@*":
    peerDependenciesMeta:
      typescript:
        optional: true
